# This workflow compiles the plain .java sources with javac/Makefile
# (the repo has no pom.xml, so the previous Maven template was replaced).
name: Java CI

on:
  workflow_dispatch:
  push:
    branches: [ master, maven ]
  pull_request:
    branches: [ master, maven ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compile with make
        run: make
      - name: Clean
        run: make clean
